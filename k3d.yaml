# k3d cluster definition — declarative, versioned infrastructure.
# Bring it up with:  k3d cluster create --config k3d.yaml
# Docs: https://k3d.io/stable/usage/configfile/
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: homelab
servers: 1
agents: 2
image: rancher/k3s:v1.31.5-k3s1
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Disable the bundled Traefik so ingress-nginx owns ports 80/443.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  k3d:
    wait: true
