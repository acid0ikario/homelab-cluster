name: homelab-cluster
runtime:
  name: python
  options:
    virtualenv: venv
description: Provisions the homelab k3d cluster and bootstraps ArgoCD (app-of-apps).
config:
  clusterName:
    type: string
    default: homelab
  agents:
    type: integer
    default: 2
  argocdNamespace:
    type: string
    default: argocd
  gitopsRepo:
    type: string
    default: https://github.com/acid0ikario/homelab-workloads
  gitopsPath:
    type: string
    default: bootstrap
  gitopsBranch:
    type: string
    default: main
